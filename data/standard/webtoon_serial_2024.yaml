# 웹툰 연재계약서 (만화 분야 표준계약서 [별표 3])
# 출처·옮겨 적은 방법·고친 곳은 data/standard/SOURCE.md 참고.
# core: true = MVP에서 비교하는 정산 관련 조항 (오픈북 팀이 고름. 해설집의 '핵심' 표시가 아님)
source:
  title: "만화 분야 표준계약서 [별표 3] 웹툰 연재계약서(제2조 제3호 관련)"
  issuer: "문화체육관광부"
  notice: "문화체육관광부고시 제2024-32호 (2024. 6. 13. 일부개정, 시행 2024. 6. 13.)"
  url: "https://www.law.go.kr/admRulInfoP.do?admRulSeq=2100000242452"
  retrieved: "2026-11-20"
clauses:
  - id: s-01
    "no": "제1조"
    title: "계약의 목적"
    text: |-
      이 계약은 ‘저작권자’가 창작한 대상 저작물을 ‘서비스 제공업자’에게 제공하고 ‘서비스 제공업자’는 이를 온라인 플랫폼을 통하여 연재함에 있어 양 당사자 간의 권리ㆍ의무 및 필요한 제반 사항을 규정함을 목적으로 한다.
  - id: s-02
    "no": "제2조"
    title: "정의"
    core: true
    text: |-
      1. "대상 저작물"은 위에 표시한, 이 계약의 목적이 되는 저작물을 말한다.
      2. "복제"는 대상 저작물을 인쇄ㆍ사진촬영ㆍ복사ㆍ녹음ㆍ녹화 그 밖의 방법으로 일시적 또는 영구적으로 유형물에 고정하거나 다시 제작하는 것을 말한다.
      3. "공중송신"은 대상 저작물을 공중이 수신하거나 접근하게 할 목적으로 무선 또는 유선통신의 방법에 의하여 송신하거나 이용에 제공하는 것을 말한다.
      4. "전송"은 공중송신 중 공중의 구성원이 개별적으로 선택한 시간과 장소에서 접근할 수 있도록 저작물 등을 이용에 제공하는 것을 말하며, 그에 따라 이루어지는 송신을 포함한다.
      5. "발행"은 대상 저작물을 공중의 수요를 충족시키기 위하여 복제ㆍ배포하는 것을 말한다.
      6. "배타적발행권"은 대상 저작물을 발행하거나 복제ㆍ전송(이하 "발행등"이라 한다.)할 권리를 가진 자가 그 저작물을 발행 등에 이용하고자 하는 자에 대하여 배타적 권리를 갖는 것을 말한다. 다만, 출판권은 제외한다.
      7. "2차적저작물"은 대상 저작물을 번역ㆍ편곡ㆍ변형ㆍ각색ㆍ영상제작 그 밖의 방법으로 작성한 창작물을 말한다.
      8. "2차적저작물작성권"은 대상 저작물을 원저작물로 하는 2차적저작물을 작성하여 이용할 권리를 말한다.
      9. "인터넷 사이트"는 서비스업자 또는 제3자가 이용자에게 대상 저작물을 제공하기 위하여 구축ㆍ운영하고 있는, 인터넷 서비스를 제공하는 서버가 설치되어 있는 호스트 컴퓨터 시스템을 말한다.
      10. "온라인 서비스"는 「정보통신망 이용촉진 및 정보보호 등에 관한 법률」 제2조 제1항 제1호 소정의 정보통신망을 통하여 대상 저작물을 복제, 전송하는 것을 말한다.
      11. "연재"는 대상 저작물을 "인터넷 사이트"에 "온라인 서비스"의 방법으로 계약기간 동안 정해진 주기마다 발행 등을 하는 것을 말한다.
      12. "PPL"(Product Placement)은 대상 저작물의 내용이나 맥락 내에 제3자의 상품이나 브랜드 이미지 등을 노출시켜 홍보하는 마케팅을 말한다.
      13. "완전원고"는 교정ㆍ편집만 거치면 연재가 가능한 스케치, 채색, 식자 배열 등 창작 작업이 끝난 원고를 말한다.
      14. "총 매출액"은 대상 저작물을 이용하기 위한 이용자 지불금 등으로 대상 저작물의 이용으로 발생하는 총 합계 금액을 말한다.
      15. "순 매출액"은 총 매출액에서 세금, 앱마켓(구글ㆍ애플 등) 수수료, 결제/환불 수수료 등을 공제한 금액을 말한다.
      16. "코인"은 이용자가 대상 저작물의 이용을 위해서 구매하는, 플랫폼이 발행하는 전자적 증표 또는 화폐를 말한다.
      17. 본조에서 정하지 않은 용어의 정의는 관련 법령과 상관습에 따른다.
  - id: s-03
    "no": "제3조"
    title: "계약기간 등"
    core: true
    text: |-
      ① 이 계약의 계약기간은 대상 저작물의 계약체결일로부터 (____개월 / ____회 연재일)까지로 한다. 다만, ‘저작권자’는 ‘서비스 제공업자’에게 이 계약에 따른 권리를 (계약기간 종료일 / 최종화 연재1)일)로부터 ____개월 간 (독점 / 비독점)으로 허락하며, 그에 따른 서비스 및 대가 지급, 정산에 필요한 범위 내에서 이 계약은 유효하게 존속(이하 권리 허락 기간)한다.
      1) 최종화 연재를 상호 합의 없이 임의로 변동시킬 수 없음
      ② ‘저작권자’와 ‘서비스 제공업자’는 계약기간 만료일 ____개월 전까지 계약 연장에 서면으로 합의할 수 있고, 그 경우 이 계약은 같은 조건으로 (____개월 / ____회) 연장된다. 다만, ‘저작권자’와 ‘서비스 제공업자’는 연장에 합의하면서 계약의 조건을 변경할 수 있다.
      ③ 제2항의 합의가 없는 한 이 계약은 기간 만료로 종료되며, ‘서비스 제공업자’의 권리는 제1항의 기간만큼 존속한다.
  - id: s-04
    "no": "제4조"
    title: "권리의 부여"
    text: |-
      ① ‘저작권자’는 ‘서비스 제공업자’에게 이 계약기간 중 대상 저작물을 온라인 서비스 방식으로 연재를 할 수 있는 권리를 부여한다.
      ② ‘저작권자’와 ‘서비스 제공업자’가 제1항의 권리를 독점적ㆍ배타적인 것으로 하는 배타적발행권을 설정하기로 합의하는 경우, ‘서비스 제공업자’와 ‘저작권자’는 「저작권법」 제54조 제2호에 따라 대상 저작물에 대한 배타적발행권 설정 사실을 한국저작권위원회에 등록할 수 있다.
      ③ 제2항에 따라 ‘서비스 제공업자’가 배타적발행권 설정등록을 하는 경우 ‘저작권자’는 등록에 필요한 서류를 ‘서비스 제공업자’에게 제공하는 등 이에 적극적으로 협력하여야 한다.
      ④ ‘서비스 제공업자’는 계약기간 만료, 해제ㆍ해지 등으로 이 계약이 종료된 후 (지체없이 / ____일 이내에) 배타적발행권 말소 등록을 신청하고, ‘저작권자’에게 말소하였다는 증빙 자료를 교부해야 한다.
  - id: s-05
    "no": "제5조"
    title: "서비스 제공업자의 권리 행사"
    text: |-
      ① ‘서비스 제공업자’는 이 권리 허락 기간 중 대상 저작물의 온라인 서비스 연재에 대하여 이 계약에서 정한 내용의 권리를 보유한다. 다만 ‘서비스 제공업자’가 대상 저작물을 연재할 수 있는 인터넷 사이트는 아래 기재한 도메인 주소로 한정한다.
      (예시) 가. www.웹툰연재사이트.com
      ② ‘서비스 제공업자’가 제1항에 기재한 인터넷 사이트 외에 다른 인터넷 사이트(제3자가 운영하는 사이트를 포함한다)를 연재 사이트에 포함시키거나 제외하기 위해서는 ‘저작권자’의 사전 동의를 구해야 한다.
      ③ ‘서비스 제공업자’는 대상 저작물의 가격 정책, 서비스 방향 등을 ‘저작권자’와 협의하여 결정한다.
      ④ ‘서비스 제공업자’는 대상 저작물의 홍보, 마케팅 및 프로모션 방법 등 결정할 수 있다. 다만, 이 경우 ‘서비스 제공업자’는 관련 사항을 ‘저작권자’에게 알려주어야 하며, ‘저작권자’가 의견을 제시하는 경우 성실히 협의하여야 한다.
  - id: s-06
    "no": "제6조"
    title: "연재의 계속"
    text: |-
      ① ‘저작권자’와 ‘서비스 제공업자’는 계약기간 중 대상 저작물의 연재가 원활하게 진행되도록 상호 신의와 성실로써 협조해야 한다.
      ② ‘서비스 제공업자’는 권리 허락 기간 중 ‘저작권자’에게 귀책사유가 없음에도 부당하게 ‘저작권자’가 제공한 대상 저작물의 수령을 거부하거나 연재를 지연 또는 중단해서는 아니 된다.
      ③ ‘저작권자’는 계약기간 중 ‘서비스 제공업자’에게 귀책사유가 없음에도 부당하게 대상 저작물의 창작 및 인도를 거부하거나 연재를 지연 또는 중단해서는 아니 된다.
  - id: s-07
    "no": "제7조"
    title: "원고의 인도와 연재 시기"
    text: |-
      ① ‘저작권자’는 계약 체결 이후 ____일 이내에 ‘서비스 제공업자’에게 ____회 분량의 완전원고를 인도하고, 이후 계약기간 동안 (____일/____요일)마다 제2항에서 정한 1회 분량의 완전원고를 인도한다. 다만, 부득이한 사정이 있을 때는 ‘서비스 제공업자’의 동의를 얻어 기일을 변경할 수 있다.
      ② 대상 저작물의 장르와 형식을 고려하여 원고는 회당 최소 ____컷 내외의 완전원고 형태로 제작되어야 하며, ‘저작권자’와 ‘서비스 제공업자’의 합의에 따라 분량의 상ㆍ하한을 정할 수 있다. 만일 ‘서비스 제공업자’의 요구에 따라 계약 컷수보다 ____컷 이상 늘어나는 경우 ‘서비스 제공업자’는 ‘저작권자’에게 컷당 ____원의 추가금을 지급한다.
      ③ ‘서비스 제공업자’는 제1항의 연재에 필요한 분량의 원고를 인도받은 날로부터 ____개월 이내에 대상 저작물의 연재를 개시하여야 한다. 다만, 부득이한 사정이 있을 때에는 ‘저작권자’의 동의를 얻어 기일을 변경할 수 있다.
  - id: s-08
    "no": "제8조"
    title: "휴재 등"
    text: |-
      ① ‘서비스 제공업자’는 ‘저작권자’가 대상 저작물의 창작활동 중 적절히 휴재할 수 있도록 협조한다.
      ② ‘저작권자’는 건강한 창작활동을 위해 연재 주기 기준 50회당 2회씩 휴재할 수 있으며,이때 ‘서비스 제공업자’는 조건 없는 휴재를 보장한다. 만일 ‘저작권자’가 위 보장된 휴재 시간만큼 휴재하지 않는 경우, ‘서비스 제공업자’는 그 기간만큼 ‘저작권자’에게 휴재를 권고하고 대상 저작물의 연재를 중단할 수 있다.
      ③ 휴재에 따른 모든 공지와 안내는 ‘서비스 제공업자’가 수행하며, ‘서비스 제공업자’는 ‘저작권자’에게 휴재 사실을 안내하기 위한 별도 작업을 요구할 수 없다.
      ④ 기타 불가피한 사유에 의한 휴재는 ‘저작권자’와 ‘서비스 제공업자’가 상호 협의하여 정한다.
  - id: s-09
    "no": "제9조"
    title: "대가의 지급"
    core: true
    text: |-
      ① ‘서비스 제공업자’는 ‘저작권자’에게 대상 저작물의 1회차 분량의 원고에 대해 연재료로 ____원을 지급한다.
      ② ‘서비스 제공업자’는 본조의 대가의 지급 및 제10조의 정산 등은 매월 한 번씩 진행하고, 다음 달 말일까지 ‘저작권자’가 지정하는 계좌로 지급한다.
  - id: s-10
    "no": "제10조"
    title: "정산 등"
    core: true
    text: |-
      ① ‘저작권자’와 ‘서비스 제공업자’는 수익분배(Revenue Share, 이하 ‘RS’라 한다) 비율에 따라 순 매출액을 나누어 갖는다. 이때 ‘저작권자’와 ‘서비스 제공업자’의 RS 비율은 ____%: ____%(저작권자:서비스 제공업자)이며, 제9조에 따라 지급되는 대금의 공제 방식은 제2항에서 정한다.
      ② 제9조에 따라 지급되는 대금의 공제는 ____방식으로 한다.
      ③ 순 매출액은 제2조의 정의에 따른다. 다만, ‘저작권자’와 ‘서비스 제공업자’는 서면으로 합의하여 순 매출액 산정 시 공제되는 범위 또는 항목을 달리 정할 수 있다.
      ④ ‘서비스 제공업자’는 연재 계약이 종료되더라도 대상 저작물이 서비스되는 동안에는 RS 비율에 따라 ‘저작권자’와 순매출액을 나누어 갖는다.
      ⑤ ‘서비스 제공업자’는 ‘저작권자’에게 (____주/____개월)마다 1회, 지급할 대가 유무와 관계없이 별도의 자료(엑셀 등 파일 형태를 포함한다.) 또는 인터넷 사이트를 통해 수익 정산서를 제공한다. 수익 정산서는 다음 각호의 사항을 포함한다.
      1. 해당 기간 대상 저작물로 인해 발생한 총 매출액(대여ㆍ소장ㆍ이벤트 판매 수량, 스토어별 판매 수량, 유료 판매 비율 등 포함)
      2. 저작물이 플랫폼에서 판매될 당시 코인으로 환산한 저작물의 회차별 가격 및 코인당 단가
      3. 세금, 플랫폼 수수료율 및 수수료, 결제/환불 수수료 등 비용 내역
      4. 순 매출액 내역
      5. 순 매출액 중 ‘저작권자’에게 실제 지급되는 금액(원고료, 수익분배금, 차감액, 이월금 등을 구분하여 표시한다)
      ⑥ ‘저작권자’가 제5항의 정산서 내용에 이의를 제기하는 경우, ‘서비스 제공업자’는 정산서 내용의 근거 자료(관련 계약서를 포함한다)를 제공하여야 한다. 만일 근거 자료 제공이 불가능한 객관적 사정이 있는 경우, ‘서비스 제공업자’는 별도의 합의를 거쳐 ‘저작권자’에게 이를 열람하도록 한다.
      ⑦ ‘서비스 제공업자’는 정산내역 및 정산의 근거가 되는 자료 일체를 제3조의 권리 소멸일로부터 5년 후까지 유지 및 보관하여야 한다.
      ⑧ ‘저작권자’가 제7항의 기간 동안 자료의 열람 또는 제공을 요청할 경우, ‘서비스 제공업자’는 계약 종료 여부와 관계없이 이에 응해야 한다. 제6항 제2문은 본항에도 적용된다.
  - id: s-11
    "no": "제11조"
    title: "조회 수"
    text: |-
      ① ‘서비스 제공업자’는 ‘저작권자’에게 대상 저작물의 회차별 조회 수 정보를( ____일마다 1회) 제공한다.
      ② 제1항에도 불구하고 기술적 한계 등 특별한 사정으로 인해 정확한 조회 수를 제공하기 어려운 경우 ‘서비스 제공업자’는 근사치를 제공할 수 있으며, 그러한 경우 ‘저작권자’에게 특별한 사정을 설명하여야 한다.
  - id: s-12
    "no": "제12조"
    title: "비용의 부담"
    core: true
    text: |-
      ① 대상 저작물을 창작하는 비용은 ‘저작권자’가 부담한다. 다만, ‘서비스 제공업자’는 ‘저작권자’와 협의에 따라 창작 비용 전부 또는 일부를 지원할 수 있다.
      ② 대상 저작물의 발행 등 제작비 및 판매, 홍보에 따른 비용은 ‘서비스 제공업자’가 부담한다.
      ③ ‘저작권자’가 ‘서비스 제공업자’의 요구에 따라 별도의 예고편, 후기, 일러스트레이션 등을 제작하는 경우 ‘서비스 제공업자’는 ‘저작권자’에게 이에 대한 별도의 비용을 지급하여야 한다. 이때 지급할 금전은 당사자 간 서면 합의에 의한다.
      ④ ‘저작권자’와 ‘서비스 제공업자’는 대상 저작물에 PPL을 삽입할 수 있다. 이에 대해서는 별도 합의에 따른다.
  - id: s-13
    "no": "제13조"
    title: "권리의 범위"
    text: |-
      ① ‘서비스 제공업자’는 대상 저작물을 한국어로, 제5조 제1항 및 제2항에 적시한 도메인에서 발행 등을 할 수 있다.
      ② ‘저작권자’와 ‘서비스 제공업자’는 대상 저작물을 한국어 외의 언어 또는 대한민국 외에서 발행 등을 하기 위해 상대방과 협의할 수 있으며, 이에 대하여 계약을 체결하는 경우 해당 내용에 대한 부속합의서 또는 별도 계약을 체결하여야 한다.
  - id: s-14
    "no": "제14조"
    title: "2차적저작물작성권 등"
    text: |-
      ① ‘서비스 제공업자’는 대상 저작물에 관하여 이 계약에서 명시적으로 ‘서비스 제공업자’에게 허락된 권리만을 갖는다.
      ② 대상 저작물에 대한 2차적저작물작성권은 ‘저작권자’에게 있다. ‘서비스 제공업자’는 대상 저작물의 2차적저작물 이용 등을 위해서는 ‘저작권자’와 별도 계약을 체결하여야 한다.
  - id: s-15
    "no": "제15조"
    title: "저작물의 보증 등"
    text: |-
      ① ‘저작권자’는 ‘서비스 제공업자’가 이 계약상의 권리를 행사함에 있어 장애가 되는 사정(계약 이전에 대상 저작물의 저작권을 처분하거나 권리의 목적으로 제공하는 등)이 없고, 이 권리 허락 기간 중에도 ‘서비스 제공업자’의 동의 없이 그러한 행위를 하지 않을 것임을 확인한다.
      ② ‘저작권자’는 대상 저작물의 내용으로 인해 제3자의 저작권 등 법적 권리를 침해하여 손해를 끼친 경우 이에 대한 책임을 진다. 다만 ‘서비스 제공업자’가 제공하거나 관여한 부분으로 인해 제3자의 저작권 등 법적 권리를 침해하게 된 경우에는 ‘서비스 제공업자’가 이에 대한 책임을 진다.
      ③ 해당 저작물이 제3자의 저작권 등 법적 권리를 침해했다고 볼 만한 객관적 사정이 존재하는 경우 제2항에 따라 책임이 있는 자는 이에 대해 해명하고 해결하여야 한다. 만일 해명이 없거나 문제가 해결되지 않는 경우 책임이 없는 상대방은 연재중단 등의 긴급한 조치를 할 수 있다.
  - id: s-16
    "no": "제16조"
    title: "저작인격권의 존중"
    text: |-
      ① ‘서비스 제공업자’는 대상 저작물에 관한 ‘저작자’의 저작인격권을 존중하여야 한다.
      ② ‘서비스 제공업자’는 대상 저작물 및 그 복제물에 ‘저작자’의 실명 또는 ‘저작자’가 지정하는 이명(필명)을 표시하거나 표시하지 않는 등 ‘저작자’가 요구하는 바에 따라 올바르게 사용하여야 한다.
      ③ ‘서비스 제공업자’는 대상 저작물의 제호, 내용 또는 형식을 바꾸고자 할 때는 ‘저작자’의 서면 동의를 얻어야 한다. ‘서비스 제공업자’는 대상 저작물의 성질이나 그 이용의 목적 및 형태 등에 비추어 부득이하다고 인정되는 범위 안에서의 변경을 할 수 있으나, 저작물의 본질적 내용을 변경하여서는 아니 된다.
      ④ ‘서비스 제공업자’는 대상 저작물과 관련하여 ‘저작자’의 명예를 실추시키는 행위를 하여서는 아니 된다.
      ⑤ ‘저작권자’가 ‘저작자’(창작자)가 아닌 경우 ‘서비스 제공업자’가 본조의 의무를 준수할 수 있도록 ‘저작권자’는 ‘저작자’의 의사표시나 동의 여부를 적시에 확인하여 ‘서비스 제공업자’에게 전달하여야 하고, 이를 보증한다.
  - id: s-17
    "no": "제17조"
    title: "교정 및 편집"
    text: |-
      ① 대상 저작물의 교정과 편집은 ‘서비스 제공업자’가 수행함을 원칙으로 하되, ‘저작권자’와 ‘서비스 제공업자’가 협의하여 달리 정할 수 있다.
      ② 제1항의 교정·편집 수행자의 상대방은 교정·편집 수행자에게 협력하여야 하며, ‘서비스 제공업자’는 자신이 수행한 교정·편집 결과물에 대하여 ‘저작권자’의 확인을 받아야 한다.
  - id: s-18
    "no": "제18조"
    title: "원고의 반환 등"
    text: |-
      ① 계약기간의 만료 등으로 이 계약이 종료되는 경우, ‘서비스 제공업자’는 ‘저작권자’로부터 받은 육필 원고나 원화 등 실물원고 기타 일체의 자료를 반환하여야 한다.
      ② 제1항의 원고 또는 자료가 전자적 형태로 제공되었을 경우, 이 계약 종료 시 ‘서비스 제공업자’는 이를 파기하고, 이를 파기하였다는 서면 확인서를 만들어 ‘저작권자’ 에게 교부하여야 한다.
      ③ ‘서비스 제공업자’가 원고 또는 자료를 훼손 또는 분실하거나 본조의 의무를 이행하지 않을 경우, ‘서비스 제공업자’는 이에 대한 책임을 진다. 다만, 자신의 책임 없는 사유인 경우에는 그러하지 아니한다.
      ④ 제1항 내지 제3항의 규정에도 불구하고, ‘서비스 제공업자’는 대상 저작물을 구매(일정 기간 또는 영구 소장)한 이용자에게 차질 없이 서비스를 제공하거나 제19조 제1항에 따른 성과의 보존을 위하여 필요한 최소한의 자료를 ‘저작권자’와 협의하여 보존할 수 있다.
  - id: s-19
    "no": "제19조"
    title: "서비스 제공업자의 성과 존중"
    text: |-
      ① ‘저작권자’는 저작물을 구성하는 스타일, 구성, 레이아웃 등 대상 작품의 원안을 편집하여 구성한 경우(가로페이지 만화를 세로 형태의 웹툰으로 변환하는 등) ‘서비스 제공업자’의 성과를 존중하여야 한다.
      ② ‘저작권자’가 이 계약이 종료된 후 ‘서비스 제공업자’가 구성한 제1항의 성과를 활용하기 위해서는 ‘저작권자’와 ‘서비스 제공업자’가 별도의 서면 합의를 거쳐야 한다.
  - id: s-20
    "no": "제20조"
    title: "권리·의무의 양도 등"
    text: |-
      ‘저작권자’와 ‘서비스 제공업자’는 상대방의 동의 없이는 이 계약상 권리·의무 또는 계약상 지위를 제3자에게 양도할 수 없다.
  - id: s-21
    "no": "제21조"
    title: "계약 내용의 변경 및 보완"
    text: |-
      ① ‘저작권자’와 ‘서비스 제공업자’는 필요시 서면 합의에 따라 이 계약의 내용 중 일부를 변경할 수 있으며, 그 서면 합의에서 달리 정함이 없는 한 변경된 사항은 그다음 날부터 효력을 가진다.
      ② ‘저작권자’와 ‘서비스 제공업자’는 이 계약의 내용을 보충하거나, 이 계약에서 정하지 아니한 사항을 규정하기 위하여 부속합의서를 작성할 수 있다.
      ③ 제2항에 따른 부속 합의는 이 계약의 내용과 배치되거나 위반하지 않는 범위로 한정한다.
  - id: s-22
    "no": "제22조"
    title: "계약의 해지 또는 해제"
    core: true
    text: |-
      ① ‘저작권자’ 또는 ‘서비스 제공업자’가 이 계약에서 정한 사항을 위반하였을 경우 그 상대방은 ____일 이상의 기간을 정하여 제대로 이행할 것을 요구할 수 있다.
      ② 제1항의 조치에도 불구하고 이를 이행하지 아니하는 경우, 그 상대방은 대상 저작물의 연재가 시작되기 이전까지는 이 계약을 해지·해제할 수 있으며, 연재가 시작된 후에는 계약을 해지할 수 있다.
      ③ ‘저작권자’ 또는 ‘서비스 제공업자’는 상대방이 더 이상 대상 저작물을 이 계약에 따라 연재할 의사가 없음을 서면으로 통지하거나, 상대방이 다음 각호의 사유로 이 계약에 따른 연재를 계속할 수 없음이 명백한 경우에는 상대방에게 서면으로 이 계약의 해지를 통고할 수 있다.
      1. 회생, 파산, 회사정리, 해산 또는 청산절차가 개시된 경우
      2. 발행한 어음, 수표가 지급 거절되는 경우
      3. 제3자에게 인수 또는 합병되거나 영업을 위하여 필요한 주요한 재산이 제3자에게 양도되는 경우
      4. 영업을 위하여 필요한 주요 재산에 대하여 법원의 보전처분 또는 강제집행이 개시되고 60일 이내에 해소되지 않는 경우
      5. 고의적인 30일 이상의 계약 불이행 및 연락 두절 등으로 연재를 지속할 수 없는 사정이 객관적으로 명백한 경우
      6. 작품 표절, 사회적 물의로 인한 계약 상대방의 손해, 범죄 등이 법원의 판결 등으로 객관적으로 입증된 경우
      ④ 이 계약이 해지되면, ‘서비스 제공업자’는 다음과 같은 책임을 부담한다.
      1. ‘서비스 제공업자’는 제9조 및 제10조에 따라 ‘저작권자’에게 해지 시점(제2호의 단서 기간 포함)까지 발생한 모든 대금(원고료, RS 등)을 지급한다.
      2. ‘서비스 제공업자’는 즉시 대상 저작물의 복제, 전송 등 모든 서비스를 중지한다. 다만, ‘서비스 제공업자’는 대상 저작물의 이용자를 위해 필요한 범위 안에서 30일 이내의 기간 동안 서비스를 할 수 있다.
  - id: s-23
    "no": "제23조"
    title: "손해배상"
    text: |-
      ① 이 계약을 고의 또는 과실로 위반한 당사자는 상대방에게 이로 인한 손해를 배상하여야 한다.
      ② 계약의 해지 또는 해제 사실은 손해배상의 청구에 영향을 미치지 아니한다.
  - id: s-24
    "no": "제24조"
    title: "불가항력"
    text: |-
      천재지변, 자연재해, 전쟁, 내란, 폭동 그 밖의 불가항력적 사유로 인하여 ‘저작권자’ 또는 ‘서비스 제공업자’가 이 계약상 의무를 이행하지 못하게 된 경우에는 계약 불이행에 대한 서로의 책임을 면제하며, 쌍방이 서면 합의를 통해 후속 조치를 결정한다.
  - id: s-25
    "no": "제25조"
    title: "성희롱 등의 금지"
    text: |-
      ① ‘저작권자’와 ‘서비스 제공업자’는 상대방 또는 상대방의 임직원 등 관련자로부터 객관적인 증거로 확인되는 성희롱ㆍ성폭력 피해를 입은 경우 행위자의 업무 배제 등 적절한 조치를 요청할 수 있고, 상대방은 이러한 조치를 수행하여야 한다.
      ② ‘저작권자’ 또는 ‘서비스 제공업자’는 상대방 또는 상대방의 임직원 등 관련자로부터의 성희롱ㆍ성폭력으로 인한 국가인권위원회의 결정이나 법원의 확정판결을 받은 경우, 이 계약을 해지 또는 해제할 수 있다.
  - id: s-26
    "no": "제26조"
    title: "비밀유지"
    text: |-
      ① ‘저작권자’와 ‘서비스 제공업자’는 이 계약의 내용 및 계약 이행 과정에서 알게 된 상대방의 영업상 비밀 정보를 상대방의 사전 승낙 없이 제3자에게 공개 또는 누설하여서는 아니 된다.
      ② 아래 각호의 경우는 제1항의 적용을 받지 아니한다.
      1. 계약서 체결 또는 검토를 위하여 비밀유지의무를 지는 변호사 등 전문가, 만화, 예술 또는 저작권 관련 공공기관 및 설립에 필요한 법령상 절차를 거친 협회·단체·조합 등의 자문을 받는 경우
      2. 수사나 소송 등의 분쟁으로 인해 수사기관 또는 사법기관에 제출하는 경우
      3. 법령에 따른 신고나 조사를 위한 목적으로 제공하는 경우
      4. 그 밖의 법령에 의해 정보의 공개가 강제되는 경우
      ③ ‘저작권자’와 ‘서비스 제공업자’는 이 계약의 이행 과정에서 알게 된 상대방의 개인정보를 유의하여 취급하여야 하며, 상대방 동의 없이 이를 공개, 누설 또는 이용하여서는 아니 된다.
  - id: s-27
    "no": "제27조"
    title: "저작권자의 정보 이용"
    text: |-
      ‘저작권자’는 ‘서비스 제공업자’가 이 계약에 따른 홍보, 판매 등을 위하여 ‘저작권자’가 제공한 정보를 스스로 또는 제3자를 통하여 공개 또는 이용하는 것을 허락한다. 다만, ‘저작자’의 실명과 초상의 공개 또는 이용에 대하여는 ‘저작자’와 ‘서비스 제공업자’가 별도 합의하여 결정한다.
  - id: s-28
    "no": "제28조"
    title: "저작권 침해의 공동대응"
    text: |-
      ‘저작권자’와 ‘서비스 제공업자’는 대상 저작물에 대한 저작권 침해 행위에 적극적으로 대응하여야 하며, 이를 위해 필요한 경우 상대방에게 자료를 제공하는 등 적극적으로 협조하여야 한다.
  - id: s-29
    "no": "제29조"
    title: "예술인고용보험"
    text: |-
      ① ‘서비스 제공업자’는 「고용보험법」에 따라 고용보험이 적용되는 경우 ‘저작권자’를 피보험자로 하는 고용보험 취득신고 등 자격관리업무를 성실히 수행한다.
      ② ‘서비스 제공업자’는 「고용보험 및 산업재해보상보험의 보험료징수 등에 관한 법률」에 따라 ‘저작권자’와 ‘서비스 제공업자’가 부담하여야 하는 고용보험료를 납부하여야 한다. 이 경우 ‘서비스 제공업자’는 ‘저작권자’가 부담하여야 하는 고용보험료를 ‘저작권자’에게 지급하는 보수에서 원천공제하여 납부할 수 있다.
  - id: s-30
    "no": "제30조"
    title: "분쟁 해결"
    text: |-
      ① 이 계약에서 발생하는 모든 분쟁은 ‘저작권자’와 ‘서비스 제공업자’가 자율적으로 해결하도록 노력한다.
      ② ‘저작권자’ 또는 ‘서비스 제공업자’는 소송에 앞서 한국저작권위원회의 조정을 받을 수 있다.
      ③ 이 계약과 관련된 소송은 민사소송법상의 관할법원을 제1심 법원으로 한다.
  - id: s-31
    "no": "제31조"
    title: "설명 의무"
    text: |-
      ① ‘서비스 제공업자’는 ‘저작권자’에게 이 계약서의 주요 내용과 취지를 설명해야 한다. 다만, ‘저작권자’의 의사에 따라 추가되거나 변경된 계약의 내용은 ‘저작권자’가 ‘서비스 제공업자’에게 설명하여야 한다.
      ② 제1항의 설명과 별개로, ‘서비스 제공업자’는 ‘저작권자’가 계약서 내용 전문을 최초로 확인한 시점으로부터 최소 15일의 기간을 보장하여 ‘저작권자’가 계약 전 법률 자문을 받을 수 있는 충분한 시간을 주어야 한다.
  - id: s-32
    "no": "제32조"
    title: "효력 발생"
    text: |-
      이 계약은 계약체결일로부터 효력이 발생된다.
