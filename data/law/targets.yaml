# 법령 근거 Q&A에 쓰는 법령 목록 (허정민 님 확인 2026-11-25)
# `python -m openbook.law build`가 법제처 Open API에서 각 법령의 현행 조문을 받아 색인을 만든다.
# 법령명은 법제처 법령명과 글자까지 같아야 한다. articles가 있으면 그 조문만 넣는다.
# 넣지 않은 것: 하도급법(웹툰 연재 계약 적용 근거 미확인), 대중문화예술산업발전법(가수·배우 대상).
# 문체부 표준계약서는 법령이 아니라 고시라서 여기 넣지 않고 표준계약서 비교(comparison)로 따로 보인다.
laws:
  - name: 저작권법
  - name: 만화진흥에 관한 법률
  - name: 예술인의 지위와 권리의 보장에 관한 법률
  - name: 예술인 복지법
  - name: 콘텐츠산업 진흥법
  - name: 약관의 규제에 관한 법률
  # 정산 Q&A의 원천징수 질문 대비. 계산은 엔진(3.3% 고정)이 하고, 여기는 조문을 보여 주기만 한다.
  # 소액부징수(제86조)는 계산에 쓰지 않기로 해서(2026-11-25) 넣지 않는다.
  - name: 소득세법
    articles: [제19조, 제21조, 제127조, 제129조, 제144조, 제145조]
