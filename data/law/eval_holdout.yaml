# 법령 검색 확인용 질문 (2026-11-24). 용어 사전(GLOSSARY)·기준값을 고를 때 쓰지 않은 질문.
# 사전을 eval.yaml에 맞춰 고른 탓에 점수가 부풀었는지 이 파일로 따로 잰다.
# python -m openbook.law eval --cases data/law/eval_holdout.yaml
questions:
  - q: 웹소설을 영화로 만들려면 누구 허락을 받아야 하나요?
    expect: [저작권법 제99조, 저작권법 제22조, 저작권법 제46조]
  - q: 애니메이션 제작사가 내 웹툰을 쓰려면 어떤 권리가 필요한가요?
    expect: [저작권법 제99조, 저작권법 제22조, 저작권법 제101조]
  - q: 내 그림을 출판사가 허락 없이 고쳐서 냈어요
    expect: [저작권법 제13조, 저작권법 제58조의2]
  - q: 연재 계약이 끝나면 남은 단행본 재고는 어떻게 되나요?
    expect: [저작권법 제61조]
  - q: 작품 저작권을 플랫폼에 넘기는 계약을 했는데 등록이 필요한가요?
    expect: [저작권법 제54조, 저작권법 제45조]
  - q: 웹툰 표지에 내 이름이 빠져 있어요
    expect: [저작권법 제12조]
  - q: 배타적발행권은 몇 년 동안 유지되나요?
    expect: [저작권법 제59조]
  - q: 플랫폼이 예술인에게 수익 정보를 숨기면 불공정행위인가요?
    expect: [예술인의 지위와 권리의 보장에 관한 법률 제13조]
  - q: 정산서에 적힌 서버 운영비는 왜 빠졌나요?
    expect: []
  - q: 다음 달 정산금은 얼마 받나요?
    expect: []
