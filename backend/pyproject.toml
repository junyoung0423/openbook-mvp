[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openbook"
version = "0.1.0"
description = "오픈북 MVP 백엔드: API, AI 파이프라인, 계산 엔진"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# AI 파이프라인 의존성은 모듈 작업을 시작할 때 버전을 맞춰 추가합니다.
# 예: langchain, langchain-upstage, chromadb, sentence-transformers
ai = []
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
